# Activated in AWS (SPRING_PROFILES_ACTIVE=aws): Amazon MSK with IAM auth over TLS, credentials from the ECS task role.
spring:
  kafka:
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

bank:
  security:
    mfa:
      seed-key: ${MFA_SEED_KEY} # no default: startup fails without it, so the published dev key never reaches AWS
