spring:
  application:
    name: core-banking
  threads:
    virtual:
      # Off on purpose: on Java 21, blocking inside synchronized code (JDBC, gRPC, Kafka clients) pins virtual
      # threads to their carriers. k6 at 140 transfers/s: p95 4.8 s with virtual threads, 27 ms without.
      # Re-enable on Java 24+ (JEP 491 removes synchronized pinning) and re-run `make load` to confirm.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kuntur}
    username: ${DB_USER:kuntur}
    password: ${DB_PASSWORD:kuntur}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # The app runs as a role that owns nothing, so row-level security cannot be bypassed (ADR-0009).
      connection-init-sql: SET ROLE kuntur_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
    # Migrations run on their own connection as the schema owner (no SET ROLE).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kuntur}
    user: ${DB_OWNER_USER:${DB_USER:kuntur}}
    password: ${DB_OWNER_PASSWORD:${DB_PASSWORD:kuntur}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest

server:
  shutdown: graceful
  # Behind nginx/ALB the socket peer is the proxy: trust X-Forwarded-For from private-range proxies so the
  # login rate limit and the audit trail see the real client IP instead of one shared proxy address.
  forward-headers-strategy: native
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sbom
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    export:
      enabled: ${TRACING_EXPORT:false}
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus; OTLP push only when a collector exists (otherwise it logs a WARN a minute)
        enabled: ${OTLP_METRICS_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

bank:
  security:
    jwt:
      issuer: kuntur-core
      access-token-ttl: 10m
      refresh-token-ttl: 7d
      # PEM-encoded RSA keys (PKCS#8 private, X.509 public). Empty => ephemeral key pair (dev only).
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    mfa:
      # Base64 AES-256 key that seals TOTP seeds in the DB. The default is a PUBLISHED dev key; the aws profile requires a real one.
      seed-key: ${MFA_SEED_KEY:npKyjjiVVj+pqzVUPODM8c0n0sANlARLh7uiJWCWFYg=}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8088}
    login:
      max-attempts-per-minute: ${LOGIN_RATE_LIMIT:10}
      lockout-threshold: 5
      lockout-duration: 15m
  risk:
    target: ${RISK_ENGINE_TARGET:localhost:9090}
    deadline: 500ms
    # When the engine is unreachable, transfers below this amount still go through; the rest are held.
    fail-open-below-minor: 5000
  kafka:
    payments-topic: bank.payments.events.v1
  outbox:
    poll-interval: 250ms
  demo:
    seed: ${DEMO_SEED:false}
  simulator:
    enabled: ${SIMULATOR_ENABLED:false}
