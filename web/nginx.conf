# SPA + reverse proxy to core-banking. Same origin for API and WebSocket, so no CORS in production.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Named like the host because the name becomes the Host header (Tomcat rejects underscores).
# Reused connections to the API: without keepalive every request opens a new TCP connection, and under load
# (~130 req/s on a laptop) the handshakes queue up and p95 jumps from ~15 ms to seconds.
upstream core-banking {
  server core-banking:8080;
  keepalive 64;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://core-banking;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://core-banking;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # No add_header here: one in a location drops every server-level security header for that location
  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
