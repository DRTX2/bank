# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
  - repo: local
    hooks:
      - id: web-lint
        name: web lint
        entry: npm --prefix web run lint
        language: system
        files: ^web/src/
        pass_filenames: false
