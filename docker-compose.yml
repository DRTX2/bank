# Full local stack: `docker compose up --build`, then open http://localhost:8088
# Observability extras: `docker compose --profile observability up --build` (Grafana on :3000)
name: kuntur

x-java-env: &java-env
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: kuntur
  DB_PASSWORD: kuntur
  LOG_FORMAT: ecs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kuntur
      POSTGRES_USER: kuntur
      POSTGRES_PASSWORD: kuntur
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuntur -d kuntur"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-topics:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
                 "--topic", "bank.payments.events.v1", "--partitions", "6", "--replication-factor", "1"]

  risk-engine:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { MODULE: risk-engine }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/risk
    depends_on:
      postgres: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }

  core-banking:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { MODULE: core-banking }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/kuntur
      RISK_ENGINE_TARGET: risk-engine:9090
      DEMO_SEED: "true"
      SIMULATOR_ENABLED: "true"
      CORS_ORIGINS: http://localhost:8088,http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
      risk-engine: { condition: service_started }

  web:
    build: ./web
    ports: ["8088:8080"]
    depends_on: [core-banking]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.4
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]

volumes:
  pgdata:
